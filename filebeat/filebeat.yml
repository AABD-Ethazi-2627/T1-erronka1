# ═══════════════════════════════════════════════════════════════════
# CNC Guard — Filebeat Konfigurazioa
# ═══════════════════════════════════════════════════════════════════

# 1. SARRERA: Simuladorearen CSV fitxategiak (NFS bidez muntatuta)
filebeat.inputs:
  - type: filestream
    id: cnc-stream
    paths:
      - /mnt/cnc-stream/*.csv

    # CSV fitxategiek goiburu-lerro bat dute (zutabe-izenak).
    # Goiburua letraz hasten da (timestamp,...); datu-lerroak data batez (2026-...)
    exclude_lines: ['^[A-Za-z]']

    # NFS-ekin lan egiten ari garenez, fitxategi-jarraipena
    # path bidez egin behar da (inodo-aldaketak ekiditeko)
    file_identity.path: ~

# 2. IRTEERA: Kafka topiko batera — NiFi-k handik kontsumituko ditu.
# Lerro gordina bidali, ez Beats event JSON osoa (codec.format).
output.kafka:
  hosts:
    - kafka:9092
  topic: cnc-sensors-raw
  codec.format:
    string: '%{[message]}'

# 3. ERREGISTROA
logging.level: info
logging.to_files: false
